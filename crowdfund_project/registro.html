<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Crear Cuenta</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <header class="header">
    <nav class="navbar">
      <div class="brand">CrowdFund</div>
      <div class="nav-links">
        <a href="index.html">Inicio</a>
        <a href="explorar.html">Proyectos</a>
      </div>
      <div class="actions">
        <a class="btn btn-outline" href="login.html">Login</a>
      </div>
    </nav>
  </header>

  <main class="container">
    <div class="form-card">
      <h3>Crear Cuenta</h3>
      <p style="color:var(--muted)">Regístrate para comenzar a crear y apoyar proyectos</p>
      <form>
        <label>Nombre Completo</label>
        <input class="input" type="text" placeholder="Tu nombre completo" required>
        <label>Correo Electrónico</label>
        <input class="input" type="email" placeholder="tu@email.com" required>
        <label>Contraseña</label>
        <input class="input" type="password" placeholder="Al menos 6 caracteres" required>
        <label>Confirmar Contraseña</label>
        <input class="input" type="password" placeholder="Repite tu contraseña" required>
        <div class="form-actions">
          <button class="btn btn-primary" type="submit">Crear Cuenta</button>
          <a href="login.html" class="btn btn-ghost" style="padding:9px 12px">Inicia sesión aquí</a>
        </div>
      </form>

      <div style="background:#f7faf9;border-radius:8px;padding:12px;margin-top:14px;text-align:center">
        <div style="font-weight:700;margin-bottom:8px">Solo para demostración:</div>
        <a class="btn" style="background:#2ea44f;color:#fff;border-radius:6px;padding:9px 12px;text-decoration:none" href="#">Crear Cuenta Demo</a>
      </div>
    </div>

    <footer class="footer">© 2025 CrowdFund</footer>
  </main>
</body>
</html>
