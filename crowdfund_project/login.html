<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Iniciar Sesión</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <header class="header">
    <nav class="navbar">
      <div class="brand">CrowdFund</div>
      <div class="nav-links">
        <a href="index.html">Inicio</a>
        <a href="explorar.html">Proyectos</a>
      </div>
      <div class="actions">
        <a class="btn btn-outline" href="registro.html">Registro</a>
      </div>
    </nav>
  </header>

  <main class="container">
    <div class="form-card">
      <h3>Iniciar Sesión</h3>
      <p style="color:var(--muted)">Accede a tu cuenta para gestionar tus proyectos</p>
      <form>
        <label>Correo Electrónico</label>
        <input class="input" type="email" placeholder="tu@email.com" required>
        <label>Contraseña</label>
        <input class="input" type="password" placeholder="Tu contraseña" required>
        <div class="form-actions">
          <button class="btn btn-primary" type="submit">Iniciar Sesión</button>
        </div>
      </form>

      <div style="background:#f7faf9;border-radius:8px;padding:12px;margin-top:14px;text-align:center">
        <div style="font-weight:700;margin-bottom:8px">Solo para demostración:</div>
        <div style="display:flex;gap:10px;justify-content:center">
          <a class="btn" style="background:#2ea44f;color:#fff;border-radius:6px;padding:9px 12px;text-decoration:none" href="#">Entrar como Usuario</a>
          <a class="btn" style="background:#e24b4b;color:#fff;border-radius:6px;padding:9px 12px;text-decoration:none" href="#">Entrar como Admin</a>
        </div>
      </div>
    </div>

    <footer class="footer">© 2025 CrowdFund</footer>
  </main>
</body>
</html>
